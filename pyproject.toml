[project]
name = "app-migrate-windows"
version = "0.1.0"
description = "A Windows desktop utility for moving application directories and replacing them with NTFS junctions."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psutil>=7.2.2,<8",
    "pyside6>=6.9.0,<7",
    "pyside6-fluent-widgets>=1.11.3",
]

[project.gui-scripts]
app-migrate = "app_migrate.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_migrate"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "ruff>=0.16.3",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
